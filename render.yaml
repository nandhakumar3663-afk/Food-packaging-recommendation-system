# Render Blueprint Specification
# Smart Food Packaging Recommendation System — Phase 8 Production Deployment
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: food-packaging-system
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python scripts/init_db.py --seed"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT run:app --workers 2 --timeout 60"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: packaging-postgres
          property: connectionString

databases:
  - name: packaging-postgres
    plan: free
    databaseName: packaging_db
    user: packaging_user
